name: Android APK

# push 到 main：先跑测试，通过后才构建并发布 APK；测试失败则不发布，apk-latest 保持上一个可用版本。
# 手动触发时可勾选 skip_tests 跳过测试直接出包（紧急用）。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 跳过测试直接构建并发布（紧急用）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android unit tests
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :app:androidApp:testDebugUnitTest \
            --no-daemon --stacktrace --console=plain

      # lint 目前不作为发布门槛，只提示。
      - name: Android lint (non-blocking)
        working-directory: kmp
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew :app:androidApp:lintDebug \
            --no-daemon --stacktrace --console=plain

      - name: Run shared and server regression tests
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :server:storage:jvmTest :server:llm:jvmTest :server:http:jvmTest :server:jvmTest :app:shared:jvmTest :data:repository:jvmTest \
            --no-daemon --stacktrace --console=plain

  apk:
    needs: test
    # 测试通过，或测试被手动跳过时才出包；测试失败/取消则不发布。
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 用仓库 secrets 里的个人 keystore 签名：签名固定，后续版本才能覆盖安装。
      - name: Restore signing keystore
        working-directory: kmp
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > personal-release.jks
          {
            echo "storeFile=personal-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :app:androidApp:assembleRelease \
            --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-release.log || {
            grep -E 'What went wrong|Caused by:|FAILURE:|Could not|error:|> Task .* FAILED' /tmp/gradle-release.log | head -40 || true
            tail -60 /tmp/gradle-release.log || true
            exit 1
          }

      - name: Verify APK signature and identity
        working-directory: kmp
        shell: bash
        run: |
          # AGP 9 的产物名是 <模块名>-release.apk（本仓库为 androidApp-release.apk），
          # 不再固定为 app-release.apk；这里按 glob 解析，避免改名一次就整条流水线失败。
          APK=$(find app/androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "release APK not found:"
            ls -la app/androidApp/build/outputs/apk/release || true
            exit 1
          fi
          echo "APK=$APK"
          ls -la "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "Android SDK path is not set (ANDROID_SDK_ROOT/ANDROID_HOME)"
            exit 1
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -6

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zaomeng-release-apk
          path: kmp/app/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to release tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 造梦 个人自用 APK（最新）
          prerelease: true
          body: |
            由 GitHub Actions 自动构建并签名。
            包名 com.deng2004.zaomeng，签名固定（个人 keystore），可直接覆盖升级。
          files: kmp/app/androidApp/build/outputs/apk/release/*.apk
