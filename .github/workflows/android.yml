name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 先出包：个人自用最关心的是能装上的 APK，测试失败不应该挡住产物。
      - name: Build debug APK
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :app:androidApp:assembleDebug \
            --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-android.log || {
            grep -E 'What went wrong|Caused by:|FAILURE:|Could not|error:|> Task .* FAILED' /tmp/gradle-android.log | head -40 || true
            tail -60 /tmp/gradle-android.log || true
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zaomeng-debug-apk
          path: kmp/app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Android checks
        working-directory: kmp
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew :app:androidApp:testDebugUnitTest :app:androidApp:lintDebug \
            --no-daemon --stacktrace --console=plain

      - name: Run shared and server regression tests
        working-directory: kmp
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew :server:storage:jvmTest :server:llm:jvmTest :server:http:jvmTest :server:jvmTest :app:shared:jvmTest \
            --no-daemon --stacktrace --console=plain
