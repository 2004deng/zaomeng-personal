name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - "kmp/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "kmp/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android checks and build debug APK
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :app:androidApp:testDebugUnitTest :app:androidApp:lintDebug :app:androidApp:assembleDebug \
            --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-android.log || {
            grep -E 'What went wrong|Caused by:|FAILURE:|Could not|error:|> Task .* FAILED' /tmp/gradle-android.log | head -40 || true
            tail -60 /tmp/gradle-android.log || true
            exit 1
          }

      - name: Run shared and server regression tests
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :server:storage:jvmTest :server:llm:jvmTest :server:http:jvmTest :server:jvmTest :app:shared:jvmTest \
            --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-jvm.log || {
            grep -E 'What went wrong|Caused by:|FAILURE:|error:|> Task .* FAILED' /tmp/gradle-jvm.log | head -40 || true
            tail -60 /tmp/gradle-jvm.log || true
            exit 1
          }

      # 签名发布包需要个人 keystore，只能在本地构建，CI 只产出可安装的调试包作为冒烟验证。
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zaomeng-debug-apk
          path: kmp/app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
